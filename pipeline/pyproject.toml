[project]
name = "aitracker"
version = "0.1.0"
description = "Tracker AI modela i tech vesti na srpskom — pipeline"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitracker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S608"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: integracioni testovi nad Postgres-om (traže TEST_DATABASE_URL)"]
